<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Smart Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>📋 Smart Task Manager</h1>
                <div class="header-actions">
                    <span class="user-info">Welcome, <strong>{{ user.username }}</strong></span>
                    <a href="{{ url_for('auth.logout') }}" class="btn btn-secondary btn-sm">Logout</a>
                </div>
            </div>
        </header>

        <!-- Notifications Area -->
        <div id="notificationArea" class="notification-area"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Analytics Cards -->
            <section class="analytics-section">
                <h2>📊 Task Analytics</h2>
                <div class="analytics-grid">
                    <div class="analytics-card">
                        <div class="card-value" id="totalTasks">0</div>
                        <div class="card-label">Total Tasks</div>
                    </div>
                    <div class="analytics-card">
                        <div class="card-value" id="completedTasks">0</div>
                        <div class="card-label">Completed</div>
                    </div>
                    <div class="analytics-card">
                        <div class="card-value" id="pendingTasks">0</div>
                        <div class="card-label">Pending</div>
                    </div>
                    <div class="analytics-card">
                        <div class="card-value" id="inProgressTasks">0</div>
                        <div class="card-label">In Progress</div>
                    </div>
                    <div class="analytics-card">
                        <div class="card-value" id="completionPercentage">0%</div>
                        <div class="card-label">Completion Rate</div>
                    </div>
                    <div class="analytics-card">
                        <div class="card-value" id="highPriorityTasks">0</div>
                        <div class="card-label">High Priority</div>
                    </div>
                </div>
            </section>

            <div class="content-grid">
                <!-- Add Task Form -->
                <section class="add-task-section">
                    <h2>➕ Add New Task</h2>
                    <form id="taskForm" class="task-form">
                        <div class="form-group">
                            <label for="taskTitle">Task Title *</label>
                            <input type="text" id="taskTitle" name="title" 
                                   placeholder="Enter task title" required>
                        </div>

                        <div class="form-group">
                            <label for="taskDescription">Description</label>
                            <textarea id="taskDescription" name="description" 
                                      placeholder="Enter task description" rows="3"></textarea>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="taskPriority">Priority</label>
                                <select id="taskPriority" name="priority">
                                    <option value="low">Low</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">High</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="taskDueDate">Due Date</label>
                                <input type="date" id="taskDueDate" name="due_date">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">Create Task</button>
                    </form>
                </section>

                <!-- Tasks Table -->
                <section class="tasks-section">
                    <h2>📝 Your Tasks</h2>
                    
                    <!-- Filter Options -->
                    <div class="filter-bar">
                        <select id="statusFilter" class="filter-select">
                            <option value="">All Statuses</option>
                            <option value="pending">Pending</option>
                            <option value="in_progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                        
                        <select id="priorityFilter" class="filter-select">
                            <option value="">All Priorities</option>
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>

                    <!-- Tasks Table -->
                    <div class="table-wrapper">
                        <table class="tasks-table" id="tasksTable">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Description</th>
                                    <th>Priority</th>
                                    <th>Status</th>
                                    <th>Due Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="tasksTableBody">
                                <tr>
                                    <td colspan="6" class="text-center">No tasks yet. Create one to get started!</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Edit Task Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit Task</h2>
            <form id="editForm" class="task-form">
                <input type="hidden" id="editTaskId" name="task_id">
                
                <div class="form-group">
                    <label for="editTaskTitle">Task Title *</label>
                    <input type="text" id="editTaskTitle" name="title" required>
                </div>

                <div class="form-group">
                    <label for="editTaskDescription">Description</label>
                    <textarea id="editTaskDescription" name="description" rows="3"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="editTaskPriority">Priority</label>
                        <select id="editTaskPriority" name="priority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="editTaskStatus">Status</label>
                        <select id="editTaskStatus" name="status">
                            <option value="pending">Pending</option>
                            <option value="in_progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="editTaskDueDate">Due Date</label>
                        <input type="date" id="editTaskDueDate" name="due_date">
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Update Task</button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
