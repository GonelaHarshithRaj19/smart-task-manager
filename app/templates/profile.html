<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Smart Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>📋 Smart Task Manager</h1>
                <div class="header-actions">
                    <span class="user-info">Welcome, <strong>{{ user.username }}</strong></span>
                    <a href="{{ url_for('auth.logout') }}" class="btn btn-secondary btn-sm">Logout</a>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <section class="auth-box" style="max-width: 600px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
                <h2>👤 Your Profile</h2>
                <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid #ddd;">
                
                <div style="margin-bottom: 1.5rem;">
                    <label style="font-weight: 600; color: #333;">Username</label>
                    <p style="margin-top: 0.5rem; padding: 0.75rem; background-color: #f5f5f5; border-radius: 5px;">{{ user.username }}</p>
                </div>
                
                <div style="margin-bottom: 1.5rem;">
                    <label style="font-weight: 600; color: #333;">Email Address</label>
                    <p style="margin-top: 0.5rem; padding: 0.75rem; background-color: #f5f5f5; border-radius: 5px;">{{ user.email }}</p>
                </div>
                
                <div style="margin-bottom: 1.5rem;">
                    <label style="font-weight: 600; color: #333;">Account Created</label>
                    <p style="margin-top: 0.5rem; padding: 0.75rem; background-color: #f5f5f5; border-radius: 5px;">{{ user.created_date.strftime('%B %d, %Y at %I:%M %p') }}</p>
                </div>
                
                <div style="margin-bottom: 1.5rem;">
                    <label style="font-weight: 600; color: #333;">Total Tasks</label>
                    <p style="margin-top: 0.5rem; padding: 0.75rem; background-color: #f5f5f5; border-radius: 5px;" id="totalTasksProfile">-</p>
                </div>
                
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <a href="{{ url_for('dashboard') }}" class="btn btn-primary" style="flex: 1; text-align: center;">← Back to Dashboard</a>
                    <a href="{{ url_for('auth.logout') }}" class="btn btn-danger" style="flex: 1; text-align: center;">Logout</a>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Load total tasks count
        async function loadTaskCount() {
            try {
                const response = await fetch('/api/tasks');
                const data = await response.json();
                if (data.success) {
                    document.getElementById('totalTasksProfile').textContent = data.count || 0;
                }
            } catch (error) {
                console.error('Error loading task count:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadTaskCount);
    </script>
</body>
</html>
